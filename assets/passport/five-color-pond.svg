    <linearGradient id="deep" x2=".7" y2="1"><stop stop-color="#67afa7"/><stop offset="1" stop-color="#175c62"/></linearGradient>
    <linearGradient id="pale" x2=".4" y2="1"><stop stop-color="#cbd99f"/><stop offset="1" stop-color="#83bcb0"/></linearGradient>
