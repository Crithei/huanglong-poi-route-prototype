<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
  <title id="title">五彩池 · 水的见证者 — 黄龙旅行纪念章</title>
  <desc id="desc">原创矢量纪念章。暖金与墨绿的盾形边框内，雪山、针叶林与青绿彩池层叠展开。顶部是一滴水，底部题字五彩池、水的见证者。景观为艺术化表现。</desc>
